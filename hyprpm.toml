[repository]
name = "Hypr-3LA"
authors = ["sispx"]
url = "https://github.com/ne0tt/Hypr-3LA"
# [hyprland commit, plugin repo commit] — update the second hash after committing
commit_pins = [
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "d97ba8c3c47df46130dacfc4cb396743a906d802"],
    ["0aa6745f705f2c4b0a5004eb019ef76e5bbdb426", "0cafa8b82ac6463d71e4cf88f044a3e6774af347"]
]

[3LA-Corners]
description = "Corner brackets drawn outside window borders"
authors = ["sispx"]
output = "3LA-Corners/3LA-Corners.so"
build = ["make -C 3LA-Corners all"]

[3LA-GlitchClose]
description = "Shader-driven glitch collapse where a closed window was"
authors = ["sispx"]
output = "3LA-GlitchClose/3LA-GlitchClose.so"
build = ["make -C 3LA-GlitchClose all"]

[3LA-TitleBars]
description = "Solid-color title bar reserved above every window, with its title"
authors = ["sispx"]
output = "3LA-TitleBars/3LA-TitleBars.so"
build = ["make -C 3LA-TitleBars all"]

[3LA-Tint]
description = "Shader recolour of chosen windows' grey/black/white pixels toward a theme colour"
authors = ["sispx"]
output = "3LA-Tint/3LA-Tint.so"
build = ["make -C 3LA-Tint all"]

[3LA-MilSpec]
description = "Chamfered mil-spec HUD frame drawn outside window borders, with an optional title bar"
authors = ["sispx"]
output = "3LA-MilSpec/3LA-MilSpec.so"
build = ["make -C 3LA-MilSpec all"]
